name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the release zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Check that the tag matches the package version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Zip
        run: npm run zip
      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: release/*.zip
